name: Build cepheus kernel (4.14.357 + KSU/SUSFS)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'port (4.14.357 + 3.6 KSU/SUSFS) or exact (4.14.353 bka-inf)'
        default: 'port'
        type: choice
        options: [port, exact]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip unzip ccache python3 git curl xz-utils cpio rsync lz4 zstd device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Clone kernel source
        run: |
          if [ "${{ inputs.target }}" = "exact" ]; then
            git clone --depth=1 --branch bka-inf https://github.com/Lemonisniket/android_kernel_xiaomi_sm8150.git kernel
          else
            git clone --depth=1 --branch bka https://github.com/Lemonisniket/android_kernel_xiaomi_sm8150.git kernel
          fi

      - name: Clone KernelSU-Next & AnyKernel3
        run: |
          git clone --depth=1 --branch susfs-integration https://github.com/Lemonisniket/KernelSU-Next.git KernelSU-Next
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          rm -rf kernel/drivers/kernelsu
          ln -sfn ../../KernelSU-Next/kernel kernel/drivers/kernelsu

      - name: Apply KSU/SUSFS patches (port target only)
        if: ${{ inputs.target == 'port' }}
        run: |
          cd kernel
          patch -p1 --fuzz=3 --no-backup-if-mismatch < ../0001-Initialize-for-KernelSU-Next-min-scope-syscall-hooks.filtered.patch
          patch -p1 --fuzz=3 --no-backup-if-mismatch < ../0002-Patch-susfs-1.5.8.filtered.patch
          test -f fs/susfs.c
          test -f include/linux/susfs.h
          grep -q susfs fs/Makefile
          grep -q kernelsu drivers/Makefile
          echo "KSU + SUSFS patches applied and verified"
      - name: Restrict DTBO to cepheus only
        if: ${{ inputs.target == 'port' }}
        run: |
          cd kernel
          python3 - << 'EOF'
          p = 'arch/arm64/boot/dts/qcom/Makefile'
          src = open(p).read().splitlines(True)
          start = next(i for i, l in enumerate(src) if l.startswith('ifeq ($(CONFIG_MACH_XIAOMI_SM8150),y)'))
          end = next(i for i, l in enumerate(src) if l.startswith('endif # CONFIG_MACH_XIAOMI_SM8150'))
          block = [
              'ifeq ($(CONFIG_MACH_XIAOMI_SM8150),y)\n',
              'ifeq ($(CONFIG_BUILD_ARM64_DT_OVERLAY),y)\n',
              '\tdtbo-$(CONFIG_ARCH_SM8150) += cepheus-sm8150-overlay.dtbo\n',
              '\n',
              'cepheus-sm8150-overlay.dtbo-base := sm8150-xiaomi.dtb sm8150-v2-xiaomi.dtb sm8150p-xiaomi.dtb sm8150p-v2-xiaomi.dtb\n',
              'endif\n',
              'endif # CONFIG_MACH_XIAOMI_SM8150\n',
          ]
          open(p, 'w').writelines(src[:start] + block + src[end + 1:])
          EOF
          grep -q "cepheus-sm8150-overlay.dtbo" arch/arm64/boot/dts/qcom/Makefile
          ! grep -q "andromeda" arch/arm64/boot/dts/qcom/Makefile
          echo "DTBO restricted to cepheus"

      - name: Setup Clang r584948 (matches 3.6 build)
        run: |
          mkdir -p clang
          cd clang
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r584948.tar.gz"
          for i in $(seq 1 10); do
            curl -fL -C - --retry 5 --retry-delay 5 --retry-all-errors -o clang.tar.gz "$URL" || true
            if gzip -t clang.tar.gz 2>/dev/null; then
              echo "archive OK (attempt $i)"
              break
            fi
            echo "archive incomplete, retrying (attempt $i)"
            sleep 5
          done
          gzip -t clang.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          chmod +x bin/*
          ./bin/clang --version
          cd ..

      - name: Build kernel
        run: |
          cd kernel
          ulimit -s unlimited || ulimit -s 65536 || true
          export PATH=${{ github.workspace }}/clang/bin:$PATH
          echo "PATH is $PATH"
          which clang
          clang --version
          
          if [ "${{ inputs.target }}" = "port" ]; then
            mkdir -p out
            cp ../configs/cepheus-4.1.config out/.config
            scripts/config --file out/.config \
              -e KSU \
              -d KSU_KPROBES_HOOK \
              -e KSU_LSM_SECURITY_HOOKS \
              -e KSU_SUSFS \
              -e KSU_SUSFS_HAS_MAGIC_MOUNT \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -d CONFIG_LOCALVERSION_AUTO \
              -d MODULE_SIG \
              -d MODULE_SIG_FORCE
            make O=out ARCH=arm64 olddefconfig
          else
            make O=out ARCH=arm64 cepheus_defconfig
          fi

          export KBUILD_BUILD_USER="build-user"
          export KBUILD_BUILD_HOST="build-host"

          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- AR=llvm-ar LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-O2 -march=armv8.2-a+dotprod -mcpu=cortex-a76+crypto -Wno-error -Wno-implicit-enum-enum-cast -Wno-enum-conversion" \
            -j$(nproc) Image.gz-dtb

      - name: Package AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel/
          cd AnyKernel
          zip -r9 ../cepheus-kernel-ksun-susfs.zip *

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-kernel-ksun-susfs
          path: |
            cepheus-kernel-ksun-susfs.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel/out/.config
