name: Build cepheus kernel 4.14.357 + BBRv2 (KernelSU-Next)

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Kernel source ref from indramccaslin/android_kernel_xiaomi_sm8150'
        default: '17.0-stable-perf'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder repo (patches + config)
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Clone kernel source (your fork)
        run: |
          git clone --depth=1 --branch "${{ inputs.kernel_ref }}" \
            https://github.com/indramccaslin/android_kernel_xiaomi_sm8150.git kernel

      - name: Apply BBRv2 backport patches
        run: |
          cd kernel
          for p in ../builder/patches/0*.patch; do
            echo "== applying $p =="
            patch -p1 --fuzz=3 --no-backup-if-mismatch < "$p"
          done
          test -f net/ipv4/tcp_bbr2.c
          test -f net/ipv4/tcp_dctcp.h
          grep -q "config TCP_CONG_BBR2" net/ipv4/Kconfig
          grep -q "tcp_bbr2.o" net/ipv4/Makefile
          echo "BBRv2 patches applied and verified"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl wget build-essential bc bison flex libssl-dev libelf-dev \
            libyaml-dev pkg-config python3 zip unzip ccache rsync \
            xz-utils lz4 zstd device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Select base DTBs (generic sm8150, like build-kernel.yml)
        run: |
          cd kernel
          python3 - << 'EOF'
          p = 'arch/arm64/boot/dts/qcom/Makefile'
          src = open(p).read().splitlines(True)
          start = next(i for i, l in enumerate(src) if l.startswith('ifeq ($(CONFIG_MACH_XIAOMI_SM8150),y)'))
          end = next(i for i, l in enumerate(src) if l.startswith('endif # CONFIG_MACH_XIAOMI_SM8150'))
          block = [
              'ifeq ($(CONFIG_MACH_XIAOMI_SM8150),y)\n',
              'dtb-$(CONFIG_ARCH_SM8150) += sm8150.dtb sm8150-v2.dtb sm8150p.dtb sm8150p-v2.dtb\n',
              'endif # CONFIG_MACH_XIAOMI_SM8150\n',
          ]
          open(p, 'w').writelines(src[:start] + block + src[end + 1:])
          EOF
          grep -q "sm8150p-v2.dtb" arch/arm64/boot/dts/qcom/Makefile
          echo "Base DTBs set to 4 generic sm8150 variants (no overlays)"

      - name: Cache Clang r584948
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: clang-r584948

      - name: Setup Clang r584948 (matches build-kernel.yml)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          cd clang
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main-kernel/clang-r584948.tar.gz"
          for i in $(seq 1 8); do
            rm -f clang.tar.gz
            if curl -fL --http1.1 --retry 5 --retry-delay 5 --retry-all-errors --max-time 1800 -o clang.tar.gz "$URL" && gzip -t clang.tar.gz 2>/dev/null; then
              echo "archive OK (attempt $i)"
              break
            fi
            echo "download failed/truncated, retrying (attempt $i)"
            sleep 5
          done
          gzip -t clang.tar.gz
          tar -xzf clang.tar.gz
          rm -f clang.tar.gz
          chmod +x bin/*
          ./bin/clang --version
          cd ..

      - name: Configure kernel (BBRv2 + FQ enabled)
        run: |
          cd kernel
          mkdir -p out
          cp ../builder/configs/cepheus-4.1-bbr2.config out/.config
          scripts/config --file out/.config --set-str CONFIG_LOCALVERSION "-perf-bbr2"
          scripts/config --file out/.config \
            -e CONFIG_TCP_CONG_ADVANCED \
            -e CONFIG_TCP_CONG_BBR \
            -e CONFIG_TCP_CONG_BBR2 \
            -e CONFIG_DEFAULT_BBR2 \
            -e CONFIG_NET_SCH_FQ \
            -e CONFIG_NET_SCH_DEFAULT \
            -e CONFIG_DEFAULT_FQ \
            -d CONFIG_LOCALVERSION_AUTO \
            -d CONFIG_MODULE_SIG \
            -d CONFIG_MODULE_SIG_FORCE \
            -d CONFIG_LTO \
            -d CONFIG_LTO_CLANG
          sed -i 's/HOSTLDLIBS_dtc/HOSTLOADLIBES_dtc/' scripts/dtc/Makefile || true
          make O=out ARCH=arm64 olddefconfig
          echo "== relevant config =="
          grep -E "CONFIG_(LOCALVERSION|TCP_CONG|BBR|NET_SCH_FQ|NET_SCH_DEFAULT|DEFAULT_FQ|DEFAULT_TCP_CONG|KSU|SUSFS)" out/.config

      - name: Build kernel
        run: |
          cd kernel
          ulimit -H -s unlimited 2>/dev/null || sudo prlimit --stack=unlimited:unlimited --pid $$ 2>/dev/null || true
          ulimit -s unlimited 2>/dev/null || true
          export PATH="${{ github.workspace }}/clang/bin:$PATH"
          export ARCH=arm64 SUBARCH=arm64
          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER="cepheus"
          export KBUILD_BUILD_HOST="github-actions"
          which clang
          clang --version
          MAKE_CMD=(make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- AR=llvm-ar LD=ld.lld NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-O2 -march=armv8.2-a+dotprod -mcpu=cortex-a76+crypto -Wno-error -Wno-implicit-enum-enum-cast -Wno-enum-conversion")
          "${MAKE_CMD[@]}" -j$(nproc) Image.gz-dtb
          ls -l out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/JoK3rLeE/AnyKernel3.git anykernel
          rm -rf anykernel/.git*
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 "../cepheus-bbr2-$(date +%Y%m%d).zip" . -x "README*" "*.zip" ".git*"
          cd ..
          ls -l *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-bbr2-kernel
          path: |
            cepheus-bbr2-*.zip
            kernel/out/.config
          if-no-files-found: error
